schema_version: v1
name: stai_darul_qalam_krs
summary: |
  Template Kartu Rencana Studi (KRS) STAI Darul Qalam Tangerang beserta data default
  yang dapat digunakan oleh GPT Action untuk menghasilkan tampilan HTML maupun PDF
  yang sama dengan contoh eksport.
description: |
  Berkas konfigurasi ini menyimpan seluruh struktur HTML, gaya, dan data default KRS
  STAI Darul Qalam Tangerang dalam format YAML sehingga dapat diambil oleh sebuah GPT
  Action. Model dapat merender nilai-nilai yang diberikan pada bagian `student` dan
  `courses`, lalu menyisipkannya ke dalam templat HTML pada bagian `template_html`
  sebelum melakukan proses eksport ke PDF menggunakan library seperti jsPDF dan
  html2canvas, sesuai perilaku halaman asli.
fields:
  student:
    name: Nama lengkap mahasiswa.
    semester: Nomor semester aktif.
    nim: Nomor Induk Mahasiswa.
    year: Tahun akademik yang dicantumkan pada kartu.
    program: Program studi mahasiswa.
    status: Status perkuliahan mahasiswa.
  courses:
    - code: Kode mata kuliah.
      name: Nama mata kuliah.
      sks: Jumlah SKS mata kuliah.
      lecturer: Nama dosen pengampu.
defaults:
  student:
    name: "-"
    semester: "-"
    nim: "-"
    year: "2022"
    program: "-"
    status: "Aktif"
  signature:
    city: "Tangerang"
    date: "15 Agustus 2022"
  courses:
    - code: "MKDK 010"
      name: "Metodologi Penelitian"
      sks: 2
      lecturer: ""
    - code: "MKDK 018"
      name: "Penelitian Tindakan Kelas"
      sks: 3
      lecturer: ""
    - code: "MKDK 012"
      name: "Statistik"
      sks: 2
      lecturer: ""
    - code: "MKDK 014"
      name: "Profesi Kependidikan"
      sks: 2
      lecturer: ""
    - code: "MKK 016"
      name: "Filsafat dan Pernikiran Pendidikan Islam"
      sks: 3
      lecturer: ""
    - code: "MKL 004"
      name: "Penerangan dan Penyjaran Islam"
      sks: 2
      lecturer: ""
    - code: "MKK 022"
      name: "Pembelajaran Al-Qur'an - Hadis"
      sks: 2
      lecturer: ""
    - code: "MKK 023"
      name: "Pembelajaran Aqidah - Akhlak"
      sks: 2
      lecturer: ""
    - code: "MKK 021"
      name: "Materi PAI"
      sks: 3
      lecturer: ""
rendering:
  total_sks_formula: Sum(SKSCourses)
  template_html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KRS - STAI Darul Qalam Tangerang</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Times New Roman', Times, serif;
            }
            body {
                background-color: #f5f5f5;
                padding: 20px;
                color: #000;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                background-color: white;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                padding: 20px;
            }
            .header {
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
            }
            .university-name {
                font-size: 18px;
                font-weight: bold;
                margin-bottom: 5px;
            }
            .accreditation {
                font-size: 14px;
                margin-bottom: 5px;
            }
            .address {
                font-size: 12px;
                margin-bottom: 10px;
            }
            .document-title {
                font-size: 16px;
                font-weight: bold;
                text-decoration: underline;
                margin-bottom: 5px;
            }
            .semester {
                font-size: 14px;
                margin-bottom: 15px;
            }
            .student-info {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 20px;
            }
            .info-item {
                display: flex;
            }
            .info-label {
                width: 120px;
                font-weight: bold;
            }
            .info-value {
                flex: 1;
            }
            .courses-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 20px;
            }
            .courses-table th, .courses-table td {
                border: 1px solid #000;
                padding: 8px;
                text-align: center;
            }
            .courses-table th {
                background-color: #f0f0f0;
            }
            .total-row {
                font-weight: bold;
            }
            .signature-section {
                display: flex;
                justify-content: space-between;
                margin-top: 40px;
            }
            .signature-box {
                text-align: center;
                width: 250px;
            }
            .signature-line {
                border-top: 1px solid #000;
                margin: 40px 0 10px;
            }
            .action-buttons {
                display: flex;
                justify-content: flex-end;
                margin-top: 20px;
                gap: 10px;
            }
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .btn-primary {
                background-color: #2c5aa0;
                color: white;
            }
            .btn-secondary {
                background-color: #6c757d;
                color: white;
            }
            input, select {
                width: 100%;
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 3px;
                font-size: 14px;
            }
            .form-group {
                margin-bottom: 10px;
            }
            .form-section {
                background-color: #f9f9f9;
                padding: 15px;
                border-radius: 5px;
                margin-bottom: 20px;
            }
            .form-title {
                font-size: 16px;
                font-weight: bold;
                margin-bottom: 10px;
                color: #2c5aa0;
            }
            @media print {
                .action-buttons, .form-section {
                    display: none;
                }
                body {
                    background: white;
                    padding: 0;
                }
                .container {
                    box-shadow: none;
                    padding: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="container" id="krs-content">
            <div class="header">
                <div class="university-name">SEKOLAH TINGGI AGAMA ISLAM</div>
                <div class="university-name">STAI DARUL QALAM TANGERANG</div>
                <div class="accreditation">TERAKREDITASI "B"</div>
                <div class="address">Jalan Raya Kresesk Gandaria Kp.maja Rt 06 Rw 02 Ds.Tamiang kec.Gunung kaler Kab. Tangerang-Banten HP 081511095694</div>
                <div class="document-title">KARTU RENCANA STUDI / KRS</div>
                <div class="semester">Semester Ganjil</div>
            </div>
            <div class="student-info">
                <div class="info-item"><div class="info-label">Nama:</div><div class="info-value">{{ student.name }}</div></div>
                <div class="info-item"><div class="info-label">Semester:</div><div class="info-value">{{ student.semester }}</div></div>
                <div class="info-item"><div class="info-label">NIM:</div><div class="info-value">{{ student.nim }}</div></div>
                <div class="info-item"><div class="info-label">Tahun:</div><div class="info-value">{{ student.year }}</div></div>
                <div class="info-item"><div class="info-label">Program Studi:</div><div class="info-value">{{ student.program }}</div></div>
                <div class="info-item"><div class="info-label">Status:</div><div class="info-value">{{ student.status }}</div></div>
            </div>
            <table class="courses-table">
                <thead>
                    <tr>
                        <th width="5%">No</th>
                        <th width="15%">KODE MK</th>
                        <th width="45%">MATA KULIAH</th>
                        <th width="10%">SKS</th>
                        <th width="25%">NAMA DOSEN</th>
                    </tr>
                </thead>
                <tbody>
                    {% for course in courses %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ course.code }}</td>
                        <td>{{ course.name }}</td>
                        <td>{{ course.sks }}</td>
                        <td>{{ course.lecturer }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="3">JUMLAH</td>
                        <td>{{ total_sks }}</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            <div class="signature-section">
                <div class="signature-box">
                    <div>Mengetahui,</div>
                    <div>Puket 1 Akademik</div>
                    <div class="signature-line"></div>
                    <div>(__________________________)</div>
                </div>
                <div class="signature-box">
                    <div>{{ signature.city }}, {{ signature.date }}</div>
                    <div>Mahasiswa</div>
                    <div class="signature-line"></div>
                    <div>(__________________________)</div>
                </div>
            </div>
        </div>
    </body>
    </html>
notes: |
  - Field `signature.date` dapat diisi dengan format tanggal berbahasa Indonesia, misalnya "15 Agustus 2022".
  - GPT Action dapat menghitung `total_sks` menggunakan `total_sks_formula` atau menjumlahkan langsung kolom SKS.
  - Templat HTML di atas mempertahankan struktur, gaya, dan elemen yang sama seperti halaman HTML asli,
    sehingga hasil render dan eksport PDF akan identik.
